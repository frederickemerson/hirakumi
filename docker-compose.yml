name: hirakumi

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hirakumi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hirakumi
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirakumi -d hirakumi"]
      interval: 5s
      timeout: 3s
      retries: 30

  payment-service:
    image: ghcr.io/masumi-network/masumi-payment-service:0.29.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - deploy/masumi.env
    environment:
      DATABASE_URL: postgresql://hirakumi:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/masumi?schema=public&connection_limit=10
      PORT: "3001"
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30

  gateway:
    build:
      context: .
      dockerfile: deploy/app.Dockerfile
      args:
        APP_DIR: apps/gateway
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # DATABASE_URL comes from .env: the Hirakumi database is Neon (contract v1.1). Local postgres serves only the payment service.
    # UPSTREAM_AUTH_PRIVATE_KEY comes from .env too: the gateway alone opens the keys sellers give for their APIs.
    environment:
      PAYMENT_SERVICE_URL: http://payment-service:3001/api/v1
      GATEWAY_PORT: "4021"
    depends_on:
      postgres:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    expose:
      - "4021"

  coworker:
    build:
      context: .
      dockerfile: deploy/app.Dockerfile
      args:
        APP_DIR: apps/coworker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # DATABASE_URL comes from .env: the Hirakumi database is Neon (contract v1.1). Local postgres serves only the payment service.
    environment:
      PAYMENT_SERVICE_URL: http://payment-service:3001/api/v1
      # .env is shared with the gateway: only the gateway may hold the key that opens sellers' API keys.
      UPSTREAM_AUTH_PRIVATE_KEY: ""
      UPSTREAM_AUTH_PUBLIC_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy
      payment-service:
        condition: service_healthy

  price-api:
    # The demo seller API (sellers/price-api), served at price.$PUBLIC_DOMAIN. Not part of Hirakumi itself.
    build:
      context: .
      dockerfile: deploy/app.Dockerfile
      args:
        APP_DIR: sellers/price-api
    restart: unless-stopped
    environment:
      PORT: "4100"
      # Advertised in /openapi.json servers[0].url, the API's base URL. Hirakumi looks for X-Hirakumi-Verify at PUBLIC_URL/.
      PUBLIC_URL: https://price.${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env}
      ADMIN_TOKEN: ${PRICE_ADMIN_TOKEN:?set PRICE_ADMIN_TOKEN in .env}
      HIRAKUMI_CHALLENGE: ${HIRAKUMI_CHALLENGE:-{}}
    expose:
      - "4100"

  mika-api:
    # A second demo seller (sellers/fx-api, "Mika's FX Rates") at its own address, mika.$PUBLIC_DOMAIN, for onboarding a
    # fresh listing on camera while price.$PUBLIC_DOMAIN stays listed. Not part of Hirakumi itself.
    build:
      context: .
      dockerfile: deploy/app.Dockerfile
      args:
        APP_DIR: sellers/fx-api
    restart: unless-stopped
    environment:
      PORT: "4100"
      PUBLIC_URL: https://mika.${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env}
      API_TITLE: Mika's FX Rates
      ADMIN_TOKEN: ${PRICE_ADMIN_TOKEN:?set PRICE_ADMIN_TOKEN in .env}
      HIRAKUMI_CHALLENGE: ${MIKA_HIRAKUMI_CHALLENGE:-{}}
    expose:
      - "4100"

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
